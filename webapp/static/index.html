<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texas Hold'em SPA (WebSocket)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    button { padding: 8px 12px; }
    pre { background:#111; color:#eaeaea; padding:12px; border-radius:8px; height: 380px; overflow:auto; }
    .chips { margin: 10px 0; }
    #prompt { margin: 8px 0; color: #0a58ca; }
  </style>
</head>
<body>
  <h2>Texas Hold'em (FastAPI + SPA + WebSocket)</h2>
  <p>턴 단위로 사람 플레이어 액션을 전송합니다.</p>

  <div id="prompt"></div>
  <div class="row">
    <button onclick="sendAction('fold')">Fold</button>
    <button onclick="sendAction('check')">Check</button>
    <button onclick="sendAction('call')">Call</button>
    <button onclick="sendAction('raise')">Raise</button>
    <button onclick="sendAction('next_round')">Next Round</button>
  </div>

  <div id="mycards"></div>
  <div class="chips" id="standings"></div>
  <div id="revealed"></div>
  <pre id="logs">Connecting...</pre>

  <script>
    const logsEl = document.getElementById('logs');
    const standingsEl = document.getElementById('standings');
    const promptEl = document.getElementById('prompt');
    const myCardsEl = document.getElementById('mycards');
    const revealedEl = document.getElementById('revealed');

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      render(data);
    };

    ws.onopen = () => {
      logsEl.textContent = 'Connected. Waiting for state...';
    };

    ws.onclose = () => {
      logsEl.textContent += '\n[Disconnected]';
    };

    function sendAction(action) {
      if (ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ action }));
    }

    function render(data) {
      standingsEl.textContent = `Phase: ${data.phase} | Pot: ${data.pot} | ${data.standings}`;
      logsEl.textContent = (data.logs || []).join('\n');
      myCardsEl.textContent = `내 카드: ${(data.you_cards || []).join(' ')}`;
      if (data.event === 'action_required' && data.prompt) {
        promptEl.textContent = `${data.prompt.player} 차례 - to_call: ${data.prompt.to_call}, allowed: ${data.prompt.allowed.join(', ')}`;
        revealedEl.textContent = '';
      } else if (data.event === 'hand_finished') {
        promptEl.textContent = `핸드 종료: winners=${(data.winners || []).join(', ')}`;
        if (data.revealed_cards) {
          const lines = Object.entries(data.revealed_cards).map(([name, cards]) => `${name}: ${cards.join(' ')}`);
          revealedEl.textContent = `플레이어 카드 공개\n${lines.join('\n')}`;
        }
      } else {
        promptEl.textContent = '';
        revealedEl.textContent = '';
      }
    }
  </script>
</body>
</html>
